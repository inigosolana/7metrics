services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 7metrics-backend
    environment:
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 7metrics-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
